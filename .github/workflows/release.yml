name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package unsigned ZIP
        run: npx web-ext build --source-dir dist --artifacts-dir web-ext-artifacts --overwrite-dest

      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Checksums
        run: cd web-ext-artifacts && sha256sum *.zip > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            web-ext-artifacts/*.zip
            web-ext-artifacts/SHA256SUMS
          body_path: release-notes/${{ env.VERSION }}.md
          draft: false
          prerelease: false
